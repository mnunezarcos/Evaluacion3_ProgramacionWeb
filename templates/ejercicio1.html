{% extends "base.html" %}

{% block titulo %}Formulario de notas{% endblock %}

{% block contenido %}
<section class="tarjeta">
    <h1>Formulario de Notas</h1>

    <form class="formulario" method="post" action="{{ url_for('ejercicio1') }}">
        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" name="nota1" min="10" max="70"
               step="any" value="{{ nota1|default('') }}" required>

        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" name="nota2" min="10" max="70"
               step="any" value="{{ nota2|default('') }}" required>

        <label for="nota3">Nota 3</label>
        <input type="number" id="nota3" name="nota3" min="10" max="70"
               step="any" value="{{ nota3|default('') }}" required>

        <label for="asistencia">Asistencia (%)</label>
        <input type="number" id="asistencia" name="asistencia" min="0" max="100"
               step="any" value="{{ asistencia|default('') }}" required>

        <button type="submit">Enviar</button>
    </form>

    {% block resultado %}{% endblock %}
</section>
{% endblock %}
